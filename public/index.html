<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Style App - ログイン</title>
  <style>
    :root {
      --primary-accent: #4A90E2;
      --border-color: #E2E8F0;
      --text-sub: #64748B;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font-family); background-color: #FFFFFF; }

    /* Auth Screen */
    #auth-screen { 
      position: absolute; 
      inset: 0; 
      background: #FFFFFF; 
      z-index: 1000; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 24px; 
      gap: 16px; 
    }
    #auth-screen button { 
      width: 100%; 
      max-width: 320px; 
      padding: 14px; 
      background: #4F46E5; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 15px; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

  <!-- ログイン / 会員登録画面 (OAuth 2.0 対応) -->
  <div id="auth-screen">
    <h2>LINE Clone Login</h2>
    <p style="font-size: 13px; color: var(--text-sub); text-align: center;">
      認証プロバイダー (https://sennin-acount.onrender.com/) を利用してログインします。
    </p>
    <button onclick="handleOAuthLogin()">
      OAuth 2.0 でログイン
    </button>
  </div>

  <script>
    // 既にログイン済みの場合はメイン画面へリダイレクト
    window.onload = () => {
      const savedUserId = localStorage.getItem('oauth_user_id');
      if (savedUserId) {
        window.location.href = '/app.html';
      }
    };

    // OAuth ログイン開始リダイレクト
    function handleOAuthLogin() {
      window.location.href = '/api/auth/login';
    }

    // 従来のローカル認証ハンドラー (OAuthへ移行)
    async function handleSignUp() { handleOAuthLogin(); }
    async function handleLogin() { handleOAuthLogin(); }
  </script>
</body>
</html>
